services:
  postgres:
    image: postgres:17-alpine
    container_name: tekflow-postgres

    environment:
      POSTGRES_DB: tekflow_db
      POSTGRES_USER: tekflow
      POSTGRES_PASSWORD: tekflow_dev_password

    ports:
      - "5433:5432"

    volumes:
      - tekflow_postgres_data:/var/lib/postgresql/data

volumes:
  tekflow_postgres_data:
